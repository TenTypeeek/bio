<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TenTýpeeek</title>
  <meta name="description" content="Just Do It">
  <meta name="theme-color" content="#000000">
  <meta property="og:title" content="TenTýpeeek">
  <meta property="og:description" content="Just Do It">
  <style>html,body{background:#000;margin:0}</style>

  <link rel="icon" href="assets/images/avatar.webp">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- start fetching the important images immediately (keep in sync with js/config.js) -->
  <link rel="preload" as="image" href="assets/images/avatar.webp" fetchpriority="high">
  <link rel="preload" as="image" href="assets/images/cover.webp">
  <link rel="preload" as="image" href="assets/images/background-poster.webp">

  <link rel="stylesheet" href="css/style.css">
  <!-- fonts + icons load without blocking the first paint; the skeleton covers the gap -->
  <link id="gf" rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Lora:wght@600&family=Space+Grotesk:wght@400;500;700&display=swap">
  <link id="fa" rel="stylesheet" media="print" onload="this.media='all'" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
  <div id="bgimg"></div>
  <canvas id="bg"></canvas>
  <canvas id="fx"></canvas>

  <div class="vol" id="vol">
    <button class="vbtn" id="vi" aria-label="Mute / unmute"><i class="fa-solid fa-volume-high"></i></button>
    <input type="range" id="vr" min="0" max="1" step="0.01" value="0.7" aria-label="Volume">
    <span class="vp" id="vp">70</span>
  </div>

  <!-- skeleton: shown instantly, replaced by the real page once images + fonts are ready -->
  <div class="wrap" id="sk" aria-hidden="true">
    <div class="card skc">
      <div class="top">
        <div class="skcol">
          <i class="skl" style="width:230px;height:34px"></i>
          <i class="skl" style="width:170px;height:16px"></i>
          <i class="skl" style="width:110px;height:16px;margin-bottom:12px"></i>
        </div>
        <i class="sk-av"></i>
      </div>
      <div class="sk-icons" id="sk-icons"></div>
      <div class="foot"><i class="skl" style="width:36px;height:16px"></i><i class="sk-dot"></i></div>
    </div>
    <div class="player skp">
      <div class="skrow"><i class="skl" style="width:56px;height:56px;border-radius:14px"></i>
        <div class="skcol" style="flex:1"><i class="skl" style="width:40%;height:14px"></i><i class="skl" style="width:22%;height:12px"></i><i class="skl" style="width:100%;height:4px;margin-top:8px"></i></div>
        <i class="sk-dot" style="width:34px;height:34px"></i></div>
      <div class="sklyr"><i class="skl" style="width:55%;height:14px;opacity:.5"></i><i class="skl" style="width:70%;height:18px"></i><i class="skl" style="width:50%;height:14px;opacity:.5"></i></div>
    </div>
  </div>

  <main class="wrap" id="app"></main>

  <script src="js/config.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
